[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cropsmith"
version = "0.4.0"
description = "Self-contained Swiss Army knife for document and media manipulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Fully self-contained: no system ffmpeg / tesseract / ghostscript, and no
# embedded browser. OCR -> rapidocr-onnxruntime, video -> imageio-ffmpeg
# (bundled binary), PDF compression -> PyMuPDF, screen capture -> mss + pynput.
dependencies = [
    "pypdf>=4.0",
    "pdf2docx>=0.5.8",
    "rapidocr-onnxruntime>=1.3",
    "imageio-ffmpeg>=0.5",
    "Pillow>=10.0",
    "PyMuPDF>=1.24",
    "click>=8.1",
    "mss>=9.0",
    "pynput>=1.7",
]

[project.scripts]
cropsmith = "cropsmith.cli:main"

[tool.setuptools.packages.find]
include = ["cropsmith*"]
